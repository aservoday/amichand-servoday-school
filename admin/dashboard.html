<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Amichand Servoday Convent School</title>

    <link rel="stylesheet" href="css/admin.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>
<body>

<div class="sidebar">

    <div class="logo">
        <img src="../assets/images/logo.png" alt="Logo">
        <h3>ASC School</h3>
    </div>

    <ul>

        <li class="active">
            <a href="#">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </li>

        <li>
            <a href="admissions.html">
                <i class="fa-solid fa-user-graduate"></i>
                Admissions
            </a>
        </li>

        <li>
            <a href="students.html">
                <i class="fa-solid fa-users"></i>
                Students
            </a>
        </li>

        <li>
            <a href="gallery.html">
                <i class="fa-solid fa-image"></i>
                Gallery
            </a>
        </li>

        <li>
            <a href="notices.html">
                <i class="fa-solid fa-bullhorn"></i>
                Notices
            </a>
        </li>

        <li>
            <a href="fees.html">
                <i class="fa-solid fa-money-bill-wave"></i>
                Fee Structure
            </a>
        </li>

        <li>
            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>
        </li>

        <li>
            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </li>

    </ul>

</div>

<div class="main">

    <header>

        <h2>Dashboard</h2>

        <div class="admin-info">
            <i class="fa-solid fa-circle-user"></i>
            <span id="adminName">Administrator</span>
        </div>

    </header>

    <section class="cards">

        <div class="card">
            <i class="fa-solid fa-file-circle-plus"></i>
            <h3 id="totalAdmissions">0</h3>
            <p>Total Admissions</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-clock"></i>
            <h3 id="pendingAdmissions">0</h3>
            <p>Pending</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-circle-check"></i>
            <h3 id="approvedAdmissions">0</h3>
            <p>Approved</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-user-group"></i>
            <h3 id="totalStudents">0</h3>
            <p>Total Students</p>
        </div>

    </section>

    <section class="recent">

        <div class="table-box">

            <div class="table-header">
                <h3>Recent Admissions</h3>
            </div>

            <table>

                <thead>

                <tr>
                    <th>Admission No.</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody id="recentAdmissions">

                <tr>
                    <td colspan="5" style="text-align:center;">
                        No Admissions Found
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
